{% extends "base.html" %}
{% block title %}Novo usuário{% endblock %}
{% block content %}
<div class="card narrow">
<h1>Novo usuário</h1>
<form method="post">
  {{ form.hidden_tag() }}
  <label>{{ form.email.label }} {{ form.email() }}</label>
  <label>{{ form.password.label }} {{ form.password() }}</label>
  {{ form.submit() }}
</form>
</div>
{% endblock %}
